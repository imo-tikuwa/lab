name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      # lab のランディングページをビルド
      - name: Setup Node.js (lab)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (lab)
        run: npm ci

      - name: Fetch articles data
        run: node scripts/fetch-articles.js

      - name: Fetch GitHub contribution data
        env:
          # GH_STATS_TOKEN（PAT）があればプライベートリポジトリのコントリビューションも取得
          # 未設定時は GITHUB_TOKEN（自動提供）にフォールバックしてパブリックデータのみ取得
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-github-stats.js

      - name: Build lab
        run: npm run build

      - name: Prepare site directory
        run: mv dist site

      # rpgsave-editor のビルド
      - name: Setup Node.js (rpgsave-editor)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pages/rpgsave-editor/package-lock.json

      - name: Install dependencies (rpgsave-editor)
        working-directory: pages/rpgsave-editor
        run: npm ci

      - name: Build rpgsave-editor
        working-directory: pages/rpgsave-editor
        run: npm run build
        env:
          VITE_RPGSAVE_EDITOR_GA4_MEASUREMENT_ID: ${{ secrets.VITE_RPGSAVE_EDITOR_GA4_MEASUREMENT_ID }}

      - name: Copy rpgsave-editor build
        run: cp -r pages/rpgsave-editor/dist site/rpgsave-editor

      # shiren6-price-helper のビルド
      - name: Setup Node.js (shiren6-price-helper)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pages/shiren6-price-helper/package-lock.json

      - name: Install dependencies (shiren6-price-helper)
        working-directory: pages/shiren6-price-helper
        run: npm ci

      - name: Build shiren6-price-helper
        working-directory: pages/shiren6-price-helper
        run: npm run build
        env:
          VITE_SHIREN6_PRICE_HELPER_GA4_MEASUREMENT_ID: ${{ secrets.VITE_SHIREN6_PRICE_HELPER_GA4_MEASUREMENT_ID }}

      - name: Copy shiren6-price-helper build
        run: cp -r pages/shiren6-price-helper/dist site/shiren6-price-helper

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
